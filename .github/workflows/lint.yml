name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x install.sh chroot-setup.sh config.sh files/hyprland-session
      - name: Waybar config is valid JSON
        run: python3 -c "import json; json.load(open('files/skel/.config/waybar/config.jsonc'))"
