# Retro CRT theme. Sourced at the end of hyprland.conf by themes/crt/apply.sh.
# SUPER+SHIFT+S switches the CRT screen effect on and off.

general {
    border_size = 2
    gaps_in = 3
    gaps_out = 6
    col.active_border = rgb(33ff66)
    col.inactive_border = rgb(1a3d22)
}

decoration {
    rounding = 0
    screen_shader = @SHADER@
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = rgba(33ff6655)
        color_inactive = rgba(00000000)
    }
}

animations {
    enabled = true
    bezier = snap, 0.1, 0.9, 0.1, 1.0
    animation = windows, 1, 3, snap, popin 90%
    animation = border, 1, 4, snap
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 3, snap, fade
}

misc {
    background_color = rgb(0a0f0a)
}

bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/crt-toggle.sh
