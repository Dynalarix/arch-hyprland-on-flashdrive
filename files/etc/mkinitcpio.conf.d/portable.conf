# Portable initramfs: no 'autodetect' hook, so drivers for every storage
# controller, USB host and GPU go into the image instead of only those of the
# PC that built it. 'block' and 'keyboard' sit early so USB keyboards work
# at an encryption/fsck prompt on any machine.
HOOKS=(base udev microcode modconf kms keyboard keymap consolefont block filesystems fsck)
COMPRESSION="zstd"
